<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン</title>
    <link rel="stylesheet" href="./css/yaju.css">
</head>
<body>

<div class="login-container">

    <div class="login-box">

        <a href="register.html" class="back-btn">← 戻る</a>

        <h1>ログイン</h1>

        <p class="login-text">
            学習コミュニティサイトへようこそ。<br>
            登録したアカウントでログインしてください。
        </p>

        <form>

            <input type="email" placeholder="メールアドレス">

            <input type="password" placeholder="パスワード">

            <button type="submit">
                ログイン
            </button>

        </form>

        <div class="register-link">
            <p>アカウントをお持ちでないですか？</p>
            <a href="register.html">新規登録はこちら</a>
        </div>

    </div>

</div>

</body>
</html>
